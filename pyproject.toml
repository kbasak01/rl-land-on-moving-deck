[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-land-on-moving-deck"
version = "0.1.0"
description = "RL quadrotor landing on a Froude-scaled heaving ship deck (simulation only)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "K. Basak", email = "kbasak@umd.edu" }]
keywords = ["reinforcement-learning", "quadrotor", "ship-deck-landing", "pybullet", "seakeeping"]

# Pinned exactly, per docs/IMPLEMENTATION_PLAN.md section 4. The first block is
# deck-motion-forecast's resolved set, reused verbatim so that the two projects share one
# environment: `dmf` is installed editable from third_party/ and any drift here would
# silently re-resolve its pins. See third_party/deck-motion-forecast/pyproject.toml for the
# reasoning behind torch/cu130, the onnxruntime-gpu provider preload, and why tensorrt-cu13
# is held at the 10.x series (onnxruntime-gpu 1.29.0 links libnvinfer.so.10).
#
# The second block is this project's own. gym-pybullet-drones (third_party/, editable,
# poetry-declared) asks for gymnasium ^1.3, stable-baselines3 ^2.9, pybullet ^3.2.7,
# torch ^2.13, numpy ^2.5, scipy ^1.18, matplotlib ^3.11 -- all satisfied by the pins below.
#
# Trap: pybullet publishes no cp312 wheel and builds from sdist. It needs build-essential
# and python3.12-dev and takes several minutes on first install; pip caches the built wheel
# afterwards. Recorded in docs/protocol.md P0-D1.
dependencies = [
  # --- shared with deck-motion-forecast, pinned identically ---
  "numpy==2.5.2",
  "scipy==1.18.1",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "torch==2.13.0",
  "onnx==1.22.0",
  "onnxruntime-gpu==1.29.0",
  "tensorrt-cu13==10.16.1.11",
  "matplotlib==3.11.1",
  "rich==15.0.0",
  "tqdm==4.70.0",
  # --- this project (resolved in Phase 0 on the reference machine, P0-D1) ---
  "gymnasium==1.3.0",
  "stable-baselines3==2.9.0",
  "pybullet==3.2.7",
  "rliable==1.2.0",
  "tensorboard==2.21.0",
  "imageio[ffmpeg]==2.37.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260815",
  "pandas-stubs==3.0.5.260730",
]
# Hyperparameter search is optional (plan section 4) and is not needed to reproduce any
# committed result, so it stays out of `dev`.
tune = ["optuna"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rld = ["py.typed"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH", "N", "D"]
# D203/D213 conflict with the google convention's D211/D212.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests carry module docstrings but not per-function ones, and fixtures shadow args.
"tests/*" = ["D103", "ARG001"]
"scripts/*" = ["D103"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true

# Packages that ship no type information. The first line is dmf's list; the second is this
# project's additions. stable_baselines3 and gymnasium ship py.typed and are checked.
[[tool.mypy.overrides]]
module = [
  "pyarrow.*", "matplotlib.*", "onnx.*", "onnxruntime.*", "scipy.*", "tensorrt.*",
  "pybullet.*", "gym_pybullet_drones.*", "rliable.*", "imageio.*", "transforms3d.*", "control.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# No `-m "not slow"`: the Phase 0 PPO smoke run and the Phase 1 parity sweep are the
# evidence their gates are read against, so `make test` runs everything by default.
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: takes more than a few seconds (long simulations, training runs, full episode sweeps)",
  "gpu: requires a CUDA device",
  "pybullet: needs a PyBullet physics client (DIRECT mode)",
  "octave: requires GNU Octave and the cloned MSS toolbox (optional Phase 7 MSS arm)",
]
