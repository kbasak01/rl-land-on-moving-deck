# gated_forecast_tcn_seed2 -- SECONDARY: seed-sensitivity arm.
# NOT the pre-registered selected seed:
# gated_forecast_tcn flies tcn_quantile seed 1, selected by the lowest-tune-pool-pinball
# rule (P4-D2). This entry flies tcn_quantile seed 2 with everything else identical, and
# is reported as secondary (seed sensitivity), never as the gated_forecast_tcn result.
#
# Otherwise identical to gated_forecast_tcn.yaml (a test asserts that only forecaster_dir
# differs): hover 0.3 m above the pad, commit to descent when dmf's quiescence rule holds
# on the FORECAST 90 % band at the predicted touchdown (src/rld/control/gated_forecast.py).
# NOT privileged: it reads the observation plus the past-only ship-motion history
# (rld.deck.forecast.ShipMotionFeed, an ideal noise-free zero-latency ship motion reference
# unit that never reaches beyond the runner's clock) and a dmf forecaster fitted on the
# P3-D2 dev pool (P4-D1). Requires the feed at every reset (needs_motion_feed=True).
#
# Forecaster: dmf's tcn_quantile, seed 2 -- the learned 9-level quantile fan; its
# 5 % and 95 % members are read off the fan, never interpolated.
#
# The rule is EXACTLY gated's predicate (rld.control.quiescence.QuiescenceRule: 12 samples,
# 1/30 s apart, same thresholds, same pad v_z), applied to max(|lo|, |hi|) of the forecast
# band -- roll, pitch, pad v_z -- at t_td + j/30 s, j = 0..11, t_td = now + height /
# descent_rate (oracle_gated's law). A window past the 3.0 s model forecast horizon does
# not qualify. How the band is built (per-channel quantiles; the pad v_z band's
# construction and calibration) is rld.deck.forecast's, recorded in P4-D3.
#
# Every key below except the last two is gated.yaml's, with gated.yaml's value. Gains are
# pid_feedforward's tuned gains, loaded by reference (not copied). Hover keys hand-set, NOT
# tuned; thresholds are dmf's (PERMISSIVE / STRICT), Froude-converted in
# src/rld/control/quiescence.py -- angles unchanged, heave-rate limit x sqrt(lambda)
# (0.8 -> 0.16 m/s permissive, 0.4 -> 0.08 m/s strict), sustain x sqrt(lambda)
# (2.0 -> 0.4 s, 3.0 -> 0.6 s) at lambda = 1/25, applied to the PAD deck-point v_z
# (P3-D3 deviation).
#
# Units: metres, metres per second and seconds are MODEL scale.

gains_from: pid_feedforward.yaml

hover_height_m: 0.3         # m of clearance above the pad while waiting
hover_kp_per_s: 2.0         # (m/s)/m on the hover-height error
hover_speed_max_m_s: 0.4    # m/s cap on the hover-height correction
hover_tolerance_m: 0.05     # m; commits are considered only within this of hover height

thresholds: permissive      # permissive | strict (dmf's names)

# Seconds model scale after which descent is committed regardless of the rule, or null.
# null: a never-quiescent forecast times out, and that timeout is reported, not hidden.
fallback_commit_s: null

# The fitted model directory (rld.deck.forecast_fit), relative to the repository root;
# gitignored, regenerated by 'make dmf-forecasters'. Loaded once, on first reset.
forecaster_dir: artifacts/dmf/tcn_quantile_seed2

# Band quantile levels (dimensionless): the 90 % interval. Checked against the
# forecaster's interval_levels when it loads; a mismatch raises.
interval: [0.05, 0.95]
