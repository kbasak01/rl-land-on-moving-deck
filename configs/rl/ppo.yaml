# Pure PPO, final runs (docs/protocol.md P3-D1 sections 5-6; plan Phase 5).
#
# Budget: 10 M env steps per seed, seeds 0-4 (P3-D1 section 5). PPO overshoots the budget
# by less than one rollout (n_steps * n_envs = 16 384 steps) and status.json records the
# actual count. Hyperparameters are the rl-experiment defaults UNTIL the pre-registered
# search (configs/rl/tune_ppo.yaml) has run; the winner is then written here with a dated
# protocol entry, before any final run starts.
#
# Units: steps are env control steps (1/30 s model scale each; one model second is five
# full-scale seconds at lambda = 1/25). *_s wall-clock fields are HOST seconds.

method: ppo
run_group: ppo                  # -> artifacts/runs/ppo/<seed>/
algo: ppo
total_steps: 10000000
n_envs: 16
vec_env: subproc
device: cpu                     # PPO always trains on the CPU (CLAUDE.md)
torch_threads: 1
pad: aft

policy:
  width: 256
  depth: 2
  activation: tanh

ppo:
  learning_rate: 3.0e-4
  lr_schedule: linear
  n_steps: 1024                 # per env; rollout = 16 384 steps
  batch_size: 4096
  n_epochs: 10
  gamma: 0.99                   # per 1/30 s control step
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
sac: null

normalize:
  norm_obs: true
  norm_reward: true             # PPO only
  clip_obs: 10.0
  clip_reward: 10.0

# Periodic evaluation on the P3-D2 TUNE pool only: the fixed P3-D3 draw from
# configs/control/tuning.yaml (seed 20260923, 60 episodes per SS, SS3-SS5, aft) -- the same
# 180 episodes the classical baselines were tuned and re-checked on (P3-D4 table).
# Deterministic policy. Evaluation steps are NOT charged to the budget (reported apart).
eval:
  interval_steps: 200000        # 50 evaluations over 10 M
  n_envs: 16
  tuning_config: configs/control/tuning.yaml
  episodes_per_ss: null         # null = the committed draw, unchanged
  deterministic: true

# P3-D1 section 6: SS3 -> SS4 -> SS5, promote at rolling tune-pool success >= 0.80 over
# >= 100 episodes at the current SS. SS6 is never trained on (rejected by the loader).
curriculum:
  enabled: true
  stages: [SS3, SS4, SS5]
  promote_success: 0.80
  window_episodes: 100

checkpoint_interval_steps: 1000000   # model.zip + vecnormalize.pkl each time, plus final/
status_interval_s: 60.0
log_interval: 1                      # SB3 table every rollout

# Reward-WEIGHT overrides of configs/env/reward.yaml; empty = the committed weights.
# v_safe_m_s and gate_height_m are structure and cannot be set here.
reward: {}
