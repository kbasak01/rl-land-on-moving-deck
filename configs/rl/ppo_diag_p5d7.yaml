# PPO diagnostic run after smoke #3 (P5-D8): identical to ppo_smoke_p5d7.yaml except for the
# budget (1 M), the evaluation and checkpoint intervals and the name. Question: does the
# policy recover after the SS3->SS4 promotion collapse, and what does SS4->SS5 do? Not a
# tuning trial (no config change follows from it unless recorded as one).
#
# Units: steps are env control steps (1/30 s model scale each). *_s fields are HOST seconds.

method: ppo_diag_p5d7
run_group: ppo_diag_p5d7        # -> artifacts/runs/ppo_diag_p5d7/<seed>/
algo: ppo
total_steps: 1000000
n_envs: 16
vec_env: subproc
device: cpu
torch_threads: 1
pad: aft

policy:
  width: 256
  depth: 2
  activation: tanh

ppo:
  learning_rate: 3.0e-4
  lr_schedule: linear
  n_steps: 1024
  batch_size: 4096
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
  log_std_init: -2.3            # std 0.10 (P5-D7)
sac: null

normalize:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0

# 25 k-step interval: 40 evaluations plus one at the final step count (1 015 808 = 62
# rollouts of 16 384), dense enough to see each curriculum promotion and what follows it.
eval:
  interval_steps: 25000
  n_envs: 16
  tuning_config: configs/control/tuning.yaml
  episodes_per_ss: null
  deterministic: true

curriculum:
  enabled: true
  stages: [SS3, SS4, SS5]
  promote_success: 0.80
  window_episodes: 100

checkpoint_interval_steps: 100000
status_interval_s: 30.0
log_interval: 1

reward: {}
