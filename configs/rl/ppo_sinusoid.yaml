# PPO trained on SINUSOIDAL deck motion -- the H4 motion-realism arm (docs/protocol.md P3-D1
# sections 5-6 and 8 (H4), P6-D1; plan D0.4).
#
# Every training AND periodic tune-pool evaluation episode (learning curves, curriculum
# promotion) flies a rld.deck.sinusoid.SinusoidDeckMotion matched to the episode's P3-D2
# realization: per-DOF amplitude sqrt(2) x the realization's committed RMS
# (results/deck_stats_seeds.csv), the realization's peak encounter period, phases drawn from
# the episode seed (src/rld/rl/motion.py). No JONSWAP motion anywhere in its training. The
# frozen-list evaluation on JONSWAP (and the H4 cross) is Phase 7.
#
# Inherited unchanged: everything above the "Phase 6 components" block is configs/rl/ppo.yaml
# verbatim except method and run_group -- trial 14's hyperparameters and reward weights
# (P5-D11; log_std_init -2.80, std 0.061), 10 M env steps per seed, seeds 0-4 (P3-D1
# section 5; no budget cut, P5-D12). No hyperparameter search of its own (P3-D1 section 5:
# any bias from inheriting pure PPO's tuning runs against this method). Same P3-D2 train
# pool, same P3-D1 section 6 curriculum (SS3 -> SS4 -> SS5 at >= 0.80 over >= 100 tune-pool
# episodes; SS6 never trained on), same tune-pool evaluation draw.
# tests/test_rl_config.py::test_phase6_config_inherits_ppo pins this.
#
# Units: steps are env control steps (1/30 s model scale each; one model second is five
# full-scale seconds at lambda = 1/25). *_s wall-clock fields are HOST seconds.

method: ppo_sinusoid
run_group: ppo_sinusoid            # -> artifacts/runs/ppo_sinusoid/<seed>/
algo: ppo
total_steps: 10000000
n_envs: 16
vec_env: subproc
device: cpu                     # PPO always trains on the CPU (CLAUDE.md)
torch_threads: 1
pad: aft

policy:
  width: 512                    # trial 14 (P5-D11)
  depth: 2
  activation: tanh

ppo:
  learning_rate: 0.0005941708698045433
  lr_schedule: linear
  n_steps: 1024                 # per env; rollout = 16 384 steps
  batch_size: 1024
  n_epochs: 5
  gamma: 0.99                   # per 1/30 s control step
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.009895217847079038
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
  log_std_init: -2.7972111202776433   # std 0.061 in action units (P5-D7 range; P5-D11)
sac: null

normalize:
  norm_obs: true
  norm_reward: true             # PPO only
  clip_obs: 10.0
  clip_reward: 10.0

# Periodic evaluation on the P3-D2 TUNE pool only: the fixed P3-D3 draw from
# configs/control/tuning.yaml (seed 20260923, 60 episodes per SS, SS3-SS5, aft) -- the same
# 180 episodes the classical baselines were tuned and re-checked on (P3-D4 table).
# Deterministic policy. Evaluation steps are NOT charged to the budget (reported apart).
eval:
  interval_steps: 200000        # 50 evaluations over 10 M
  n_envs: 16
  tuning_config: configs/control/tuning.yaml
  episodes_per_ss: null         # null = the committed draw, unchanged
  deterministic: true

# P3-D1 section 6: SS3 -> SS4 -> SS5, promote at rolling tune-pool success >= 0.80 over
# >= 100 episodes at the current SS. SS6 is never trained on (rejected by the loader).
curriculum:
  enabled: true
  stages: [SS3, SS4, SS5]
  promote_success: 0.80
  window_episodes: 100

checkpoint_interval_steps: 1000000   # model.zip + vecnormalize.pkl each time, plus final/
status_interval_s: 60.0
log_interval: 1                      # SB3 table every rollout

# Reward-WEIGHT overrides of configs/env/reward.yaml (trial 14, P5-D11). v_safe_m_s and
# gate_height_m are structure and cannot be set here.
reward:
  w_progress: 13.580398401245475
  w_vz: 5.847430455465423
  w_smooth: 0.04575471046550012
  w_time: 0.0007295555155724287
  r_success: 29.54699269030243
  r_hard_landing: 6.8282349687069654
  r_off_pad: 6.8282349687069654
  r_bounce: 6.8282349687069654
  r_crash: 42.44193982332945

# Phase 6 components (P6-D1). Absent keys mean off (null, null, jonswap); ppo.yaml omits them.
residual: null
forecast_obs: null
motion: sinusoid                # one matched sinusoid per episode (train AND tune-pool eval)
