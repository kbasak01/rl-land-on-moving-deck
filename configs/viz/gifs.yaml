# Landing GIF gallery (Phase 9, P9-D1). HAND-PICKED for visual clarity (user decision
# 2026-10-05): illustrations, not evidence and not a sample of the distribution.
# Every panel is re-flown and checked against its committed row (rld.viz.gifs.fly);
# learned seeds are picked with the episode and every caption states how many of the
# method's 5 seeds share the shown outcome. regime/ss/index name a row of the frozen list
# results/episodes/<regime>.parquet. seed is the training seed (0 for pid_feedforward).
frame_stride: 2        # control steps per frame (30 Hz control -> 15 fps, real time, model scale)
hold_s: 1.6            # extra display time of the last frame, seconds
cases:
